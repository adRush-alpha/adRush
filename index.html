function vtest(){const s=window.speechSynthesis,o=$('#vt');if(!s){o.textContent='No speech support in this browser.';return}o.textContent='Voices: '+s.getVoices().length+'. Speaking...';music(false);try{AC&&AC.suspend()}catch(e){}try{s.cancel();const u=new SpeechSynthesisUtterance('Ready to rush?');u.onstart=()=>o.textContent+=' Started.';u.onend=()=>o.textContent+=' Finished.';u.onerror=e=>o.textContent+=' Error: '+e.error;s.speak(u)}catch(e){o.textContent='Failed: '+e}setTimeout(()=>{try{AC&&AC.resume()}catch(e){}PH='login';music(true)},4000)}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=r||1.05;speechSynthesis.speak(u)}catch(e){}}
// ---------- screens ----------
const LOGO=`<svg viewBox="0 0 340 118" style="width:100%;max-width:360px;filter:drop-shadow(0 0 14px rgba(0,150,255,.8))"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd9ff"/><stop offset=".5" stop-color="#1e90ff"/><stop offset="1" stop-color="#0057ff"/></linearGradient><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#4dd9ff" stop-opacity="0"/><stop offset="1" stop-color="#4dd9ff"/></linearGradient></defs><rect x="2" y="58" width="50" height="6" rx="3" fill="url(#sg)"/><rect x="14" y="68" width="38" height="6" rx="3" fill="url(#sg)"/><rect x="0" y="78" width="52" height="6" rx="3" fill="url(#sg)"/><text x="58" y="88" font-family="system-ui,sans-serif" font-weight="900" font-style="italic" letter-spacing="-2"><tspan font-size="52" style="fill:var(--fg)">ad</tspan><tspan font-size="98" fill="url(#lg)">R</tspan><tspan font-size="52" dx="-10" style="fill:var(--fg)">ush</tspan><tspan font-size="17" dx="-2" dy="-36" style="fill:var(--fg)" opacity=".9">®</tspan></text><text x="205" y="109" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" font-family="system-ui,sans-serif" style="fill:var(--fg)" opacity=".75">WATCH. REMEMBER. RUSH.</text></svg>`;
function login(){show(`<div class="c" style="margin-top:50px">${LOGO}</div>
<div class="card"><h2>Log in</h2><input id="nm" placeholder="Player name" maxlength="14" value="${S.name||''}"><input id="ph" type="tel" placeholder="Phone number (SMS check in live version)"><button class="btn" onclick="doLogin()">Enter</button></div>`)}
function doLogin(){const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}S.name=n;save();if(window.FB)FB.load().then(r=>REMOTE=r).catch(()=>{});try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}splash()}
function splash(){show(`<div class="c" style="margin-top:120px"><p class="mut">SPONSOR OF THE WEEK</p><h1 style="font-size:46px;color:var(--acc2);text-shadow:0 0 40px rgba(77,217,255,.5)">FEASTABLES</h1><p class="mut">Demo sponsor</p><div class="bar" style="margin-top:40px"><i id="sb" style="transition:width 10s linear"></i></div></div>`);setTimeout(()=>{const b=$('#sb');if(b)b.style.width='100%'},50);setTimeout(()=>S.seen?home():rules(),10000)}
function rules(){show(`<h2>How to play</h2><div class="card"><ul class="rl"><li><b>Watch</b> the 30-second ad closely.</li><li><b>Rush:</b> answer 40 questions. Each wrong tap costs −2 seconds.</li><li><b>Clock</b> starts at 80.000s. Most time left wins.</li><li><b>Out of time?</b> Your correct answers still count. If nobody finishes all 40, most correct answers wins, then fastest.</li><li><b>10 tries a day:</b> 8 free + 2 earned by inviting new friends. Resets daily. Best run counts.</li><li><b>Ties:</b> time left, then next-best run, then earliest server timestamp. All results are final.</li></ul></div><button class="btn" onclick="S.seen=1;save();home()">Got it</button>`)}
function home(){music(false);const l=left();document.body.className='';show(`<div style="max-width:230px;margin:0 auto 6px">${LOGO}</div>
<div class="tiles"><div class="tile" style="padding:8px"><span class="mut" style="font-size:13px">Tries left today</span><b style="font-size:26px">${l>=999?'∞':l}</b></div><div class="tile" style="padding:8px"><span class="mut" style="font-size:13px">Best run</span><b style="font-size:17px;padding:5px 0">${rs(BR())}</b></div></div>
<button class="btn" style="margin:10px 0;padding:14px" ${l<1?'disabled':''} onclick="playAd(false)">PLAY</button>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><button class="btn alt" style="margin:0;padding:12px 4px;font-size:14px" onclick="rules()">Rules</button><button class="btn alt" style="margin:0;padding:12px 4px;font-size:14px" onclick="board()">Leaderboard</button><button class="btn alt" style="margin:0;padding:12px 4px;font-size:14px" onclick="earn()">Earn tries</button></div>
<div class="card" style="padding:8px 14px;margin:10px 0 0"><div class="mut c" style="font-size:12px">Prize pool (demo)</div><div class="lb" style="padding:5px 4px;font-size:14px"><span>1st place</span><span>$31,500</span></div><div class="lb" style="padding:5px 4px;font-size:14px"><span>2nd place</span><span>$12,600</span></div><div class="lb" style="padding:5px 4px;font-size:14px"><span>3rd place</span><span>$6,300</span></div><div class="lb" style="padding:5px 4px;font-size:14px;border:0"><span>Next 20 players</span><span>$630 each</span></div></div>`)}
// ---------- ad ----------
let AD;
function playAd(study){music(false);try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}try{speechSynthesis.cancel();speechSynthesis.getVoices()}catch(e){}AD={t:0,p:false,l:performance.now(),sc:-1};
show(`<div class="row" style="margin-bottom:10px"><span class="tag">${study?'STUDY MODE':'WATCH CLOSELY'}</span><span class="mut">Feastables</span></div><div class="scene" id="sc"></div><div class="bar" style="margin:14px 0"><i id="pb"></i></div>
${study?`<input type="range" id="sl" min="0" max="29999" value="0" oninput="AD.t=+this.value">
<div class="row"><button class="btn alt" style="margin:0" onclick="AD.p=!AD.p;this.textContent=AD.p?'Play':'Pause'">Pause</button><button class="btn alt" style="margin:0" onclick="shareAd()">Share ad</button></div><button class="btn" onclick="stopAd();home()">Done</button>`:''}`);
AD.iv=setInterval(()=>{const n=performance.now();if(!AD.p)AD.t+=n-AD.l;AD.l=n;
if(AD.t>=30000){if(study)AD.t=0;else{stopAd();return rush()}}
const k=Math.min(5,Math.floor(AD.t/5000));if(AD.sc!==k){AD.sc=k;$('#sc').innerHTML=scene(k)}
$('#pb').style.width=(AD.t/300)+'%';const sl=$('#sl');if(sl&&document.activeElement!==sl)sl.value=AD.t},50)}
function stopAd(){if(AD)clearInterval(AD.iv)}
function shareAd(){try{navigator.share?navigator.share({title:'adRush – Feastables ad',text:'Study this ad, then beat my time on adRush!',url:location.href}):alert('Share link: '+location.href)}catch(e){}}
// ---------- rush ----------
function rush(){INT=0;PH='intro';try{AC&&AC.resume()}catch(e){}music(true);show('<div style="display:flex;align-items:center;justify-content:center;min-height:85vh;overflow:hidden"><div class="big" id="cd" style="font-size:min(10.5vw,46px);animation:none;margin:0">Ready to Rush?</div></div>');say('Ready to rush?');
let n=5;setTimeout(function t(){const e=$('#cd'),W=Math.min(innerWidth,480);e.style.cssText='margin:0;line-height:1';e.style.animation='none';void e.offsetWidth;e.style.animation='';if(n<1){e.innerHTML='LET’S<br>RUSH!';e.style.fontSize=Math.min(.27*W,112)+'px';e.style.lineHeight='1';e.style.letterSpacing='-2px';say('Let’s rush!');return setTimeout(startQuiz,1300)}e.textContent=n;e.style.fontSize=W*(.28+(5-n)*.065)+'px';try{osc(AC.currentTime,200+(5-n)*100,.3,.3,'triangle')}catch(x){}say(String(n));n--;setTimeout(t,1000)},3800)}
let Q;
function startQuiz(){PH='play';const r=S.runs.length+1;const ix=shuf(BANK.map((_,i)=>i),rng(r*7919+13)).slice(0,37),qs=ix.map(i=>BANK[i]);qs.splice(0,0,SPQ[0]);qs.splice(19,0,SPQ[1]);qs.push(SPQ[2]);Q={r,qs,i:0,pen:0,wrong:0,at:80000,st:0,t0:performance.now(),done:0};drawQ();loop()}
const rem=()=>80000-(performance.now()-Q.t0)-Q.pen;
function loop(){if(!Q||Q.done)return;const m=rem();if(m<=0)return finish(1);INT=Math.min(1,(80000-m)/80000);document.body.className=m<9000?'hot2':m<15000?'hot':'';const e=$('#clk');if(e){e.textContent=fmt(m);e.className=m<15000?'low':''}requestAnimationFrame(loop)}
function drawQ(){const q=Q.qs[Q.i];Q.cur=shuf(q.o.slice(),Math.random);Q.first=1;
show(`<div class="row"><span class="mut">Run ${Q.r} · Q ${Q.i+1}/40</span><span class="mut">Wrong: ${Q.wrong}</span></div><div class="pill"><span id="clk">${fmt(rem())}</span></div>
<div class="bar"><i style="width:${Q.i*100/40}%"></i></div><div class="q">${q.q}</div>${Q.cur.map((o,k)=>`<button class="opt" onclick="pick(this,${k})"><i>${'ABCDE'[k]}</i>${o}</button>`).join('')}`)}
function pick(b,k){if(Q.done)return;if(Q.cur[k]===Q.qs[Q.i].a){sfx(1);(Q.log=Q.log||[]).push([Q.qs[Q.i].c,Q.first?1:0]);Q.st++;praise(PW[Math.min(Q.st,PW.length)-1]);Q.i++;Q.at=performance.now()-Q.t0+Q.pen;Q.i>=40?finish(0):drawQ()}else{sfx(0);Q.first=0;Q.st=0;Q.pen+=2000;Q.wrong++;b.disabled=true;b.classList.add('bad');if(navigator.vibrate)navigator.vibrate(80)}}
let REMOTE=[];
function LB(){const L=REMOTE.filter(x=>!x.me).map(x=>({...x,done:x.d}));
const b=BR();if(b)L.push({n:S.name,d:b.done,done:b.done,t:b.t,me:1});L.sort((a,c)=>c.d-a.d||a.t-c.t);return{L,rk:L.findIndex(x=>x.me)+1,b}}
function roll(a,b,ms,cb,done,snd){const t0=performance.now();let lt=0;(function f(now){const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);try{cb(a+(b-a)*e)}catch(x){return}
if(snd&&now-lt>70&&p<1){lt=now;try{osc(AC.currentTime,300+p*700,.06,.25,'square')}catch(x){}}
if(p<1)requestAnimationFrame(f);else if(done)done()})(t0)}
function confetti(n){const C=['#ffd54a','#4dd9ff','#4d9fff','#ff4d6d','#fff'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='cf';d.style.cssText='left:'+Math.random()*100+'vw;background:'+C[i%5]+';animation-delay:'+Math.random()*.8+'s;animation-duration:'+(1.8+Math.random()*1.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
function endRank(rk){const t=$('#tier'),n=$('#rn');if(!t||!n)return;
const T=rk==1?['NUMBER ONE!','#ffd54a']:rk<=3?['PODIUM FINISH','#ffd54a']:rk<=10?['TOP 10','#4dd9ff']:rk<=23?['IN THE PRIZE ZONE','#4d9fff']:rk<=30?['TOP 30','#4d9fff']:['KEEP CLIMBING','#9aa1b5'];
t.textContent=T[0];t.style.color=T[1];n.style.color=T[1];if(rk<=30)n.style.textShadow='0 0 40px '+T[1];if(rk<=10)n.style.animation='pop2 .6s ease-out';
if(rk<=3)confetti(rk==1?90:45);if(navigator.vibrate&&rk<=10)navigator.vibrate(rk==1?[80,60,80,60,200]:[100,60,100]);
try{[523,659,784,1047].slice(0,rk==1?4:rk<=10?3:2).forEach((f,i)=>osc(AC.currentTime+i*.12,f,.4,.3,'triangle'))}catch(e){}
const b=$('#btns');if(b)b.style.opacity=1}
function finish(out){if(Q.done)return;Q.done=1;music(false);document.body.className='';
const prev=BR(),r=out?0:Math.max(0,Math.round(rem()));
S.runs.push({r:Q.r,rem:r,done:Q.i,t:Q.at,wrong:Q.wrong});S.used=(S.used||0)+1;save();
if(window.FB&&S.name){const bb=BR();FB.submit(S.name,bb.done,bb.t).then(()=>FB.load()).then(r=>REMOTE=r).catch(()=>{})}
if(window.FB&&Q.log)FB.run(Q.r,Q.log).catch(()=>{});
const better=!prev||Q.i>prev.done||(Q.i==prev.done&&Q.at<prev.t),{L,rk}=LB(),N=L.length,fin=!out;
show(`<div class="c" style="margin-top:14px"><h1>${out?'Time’s up':'Finished!'}</h1>
<div id="sc" style="font-size:64px;font-weight:900;color:var(--acc2);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(77,217,255,.5)">${fin?'0.000s':'0/40'}</div>
<p class="mut" style="margin:0">${out?'Correct answers':'Time left'} · ${Q.wrong} wrong tap${Q.wrong==1?'':'s'}</p>
<div id="pb" style="min-height:26px;margin:12px 0;font-weight:800;letter-spacing:2px;color:var(--acc2)"></div>
<div id="rk" style="opacity:0;transition:opacity .4s"><div class="mut" style="font-size:13px;letter-spacing:2px">YOUR RANK</div><div id="rn" style="font-size:78px;font-weight:900;line-height:1">#${N}</div><div id="tier" style="font-size:20px;font-weight:900;min-height:28px;margin-top:6px"></div></div></div>
<div id="btns" style="opacity:0;transition:opacity .5s;margin-top:10px"><button class="btn" onclick="board()">Leaderboard</button><button class="btn alt" onclick="home()">Home</button></div>`);
setTimeout(()=>{const b=$('#btns');if(b)b.style.opacity=1},9000);
roll(0,fin?r/1000:Q.i,2200,v=>{$('#sc').textContent=fin?v.toFixed(3)+'s':Math.round(v)+'/40'},()=>{
const pb=$('#pb');if(!pb)return;pb.textContent=prev?(better?'NEW PERSONAL BEST':'Best so far: '+rs(BR())):'';if(prev&&!better)say('Not bad. You can do it. Rush again!');
if(better&&prev)try{[523,659,784].forEach((f,i)=>osc(AC.currentTime+i*.1,f,.3,.3,'triangle'))}catch(e){}
setTimeout(()=>{const k=$('#rk');if(!k)return;k.style.opacity=1;
roll(N,rk,rk<N?3200:500,v=>{const q=Math.round(v);$('#rn').textContent='#'+q;$('#tier').textContent=q<=1?'NUMBER ONE!':q<=3?'PODIUM':q<=10?'TOP 10':q<=30?'TOP 30':''},()=>endRank(rk),1)},better&&prev?1000:500)},1)}
// ---------- leaderboard ----------
function board(f){const {L,rk,b}=LB();
show(`<h2>Leaderboard</h2><div class="card c" id="lbv">${rk?`Your rank<div style="font-size:56px;font-weight:900">#${rk}</div><span class="mut">of ${L.length} players</span>`:'Finish a run to get ranked'}</div>
<div class="card">${L.slice(0,12).map((x,i)=>`<div class="lb ${x.me?'me':''}"><span>#${i+1} ${x.n}</span><span>${rs(x)}</span></div>`).join('')}${rk>12?`<div class="lb me"><span>#${rk} ${S.name}</span><span>${rs(b)}</span></div>`:''}</div>
<p class="mut" style="font-size:13px">${window.FB?'Live scores from everyone playing.':'Firebase not connected: showing this device only.'} Ties: time left, then next-best run, then earliest server timestamp.</p><button class="btn alt" onclick="home()">Back</button>`);
if(!f&&window.FB)FB.load().then(r=>{REMOTE=r;if($('#lbv'))board(1)}).catch(()=>{})}
// ---------- earn tries ----------
function earn(){show(`<h2>Earn extra tries</h2><div class="card"><p>Invite a <b>new</b> friend to adRush. When they join and finish a run, you earn <b>1 extra try</b>. You can earn 2 each day this way.</p><p class="mut">Earned today: ${S.earned} of 2. The same person can’t be counted twice.</p><button class="btn" onclick="invite()">Invite a friend</button><p id="msg" class="mut c"></p><p class="mut c" style="font-size:12px">Demo: the try is added as soon as you tap Invite.</p></div><button class="btn alt" onclick="home()">Back</button>`)}
function grant(m){if(S.earned>=2){$('#msg').textContent='You already have both earned tries.';return}S.earned++;save();$('#msg').textContent=m+' +1 try!'}
function invite(){shareAd();grant('Invite sent.')}
login();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,setDoc,addDoc,collection,query,orderBy,limit,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// PASTE YOUR FIREBASE WEB CONFIG HERE (Project settings > Your apps > Web app). It is safe to be public.
const cfg={apiKey:"PASTE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",appId:"PASTE_APP_ID"};
if(!cfg.apiKey.startsWith("PASTE")){
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const me=()=>auth.currentUser?Promise.resolve(auth.currentUser):signInAnonymously(auth).then(c=>c.user);
window.FB={
submit:async(n,d,t)=>{const u=await me();await setDoc(doc(db,"players",u.uid),{name:n,done:d,t:Math.round(t),ts:serverTimestamp()})},
run:async(n,log)=>{const u=await me();const c={};log.forEach(([k,ok])=>{c[k]=c[k]||{ok:0,n:0};c[k].n++;c[k].ok+=ok});await addDoc(collection(db,"runs"),{uid:u.uid,run:n,cats:c,ts:serverTimestamp()})},
load:async()=>{const u=await me();const s=await getDocs(query(collection(db,"players"),orderBy("done","desc"),orderBy("t","asc"),limit(150)));return s.docs.map(x=>{const v=x.data();return{n:v.name,d:v.done,t:v.t,me:x.id===u.uid}})}}}
</script></body></html>
