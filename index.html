async function getBoard(n){const b=BR();
if(online()){try{const[top,r]=await Promise.race([Promise.all([FB.top(n,phase().show,rg()),FB.rank(phase().show,rg())]),tmo(6000)]);return{L:top.map(x=>({n:x.name,done:x.done,t:x.t,me:x.id===r.uid})),rk:r.rk,N:r.N,b}}catch(e){console.error(e)}}
const L=b?[{n:S.name,done:b.done,t:b.t,me:1}]:[];return{L,rk:L.length?1:0,N:L.length,b}}
function roll(a,b,ms,cb,done,snd){const t0=performance.now();let lt=0;(function f(now){const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);try{cb(a+(b-a)*e)}catch(x){return}
if(snd&&now-lt>70&&p<1){lt=now;try{osc(AC.currentTime,300+p*700,.06,.25,'square')}catch(x){}}
if(p<1)requestAnimationFrame(f);else if(done)done()})(t0)}
function confetti(n){const C=['#ffd54a','#4dd9ff','#4d9fff','#ff4d6d','#fff'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='cf';d.style.cssText='left:'+Math.random()*100+'vw;background:'+C[i%5]+';animation-delay:'+Math.random()*.8+'s;animation-duration:'+(1.8+Math.random()*1.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
function endRank(rk){const t=$('#tier'),n=$('#rn');if(!t||!n)return;
const T=rk==1?['NUMBER ONE!','#ffd54a']:rk<=3?['PODIUM FINISH','#ffd54a']:rk<=10?['TOP 10','#4dd9ff']:rk<=50?['IN THE PRIZE ZONE','#4d9fff']:['KEEP CLIMBING','#9aa1b5'];
t.textContent=T[0];t.style.color=T[1];n.style.color=T[1];if(rk<=50)n.style.textShadow='0 0 40px '+T[1];if(rk<=10)n.style.animation='pop2 .6s ease-out';
if(rk<=3)confetti(rk==1?90:45);if(navigator.vibrate&&rk<=10)navigator.vibrate(rk==1?[80,60,80,60,200]:[100,60,100]);
try{[523,659,784,1047].slice(0,rk==1?4:rk<=10?3:2).forEach((f,i)=>osc(AC.currentTime+i*.12,f,.4,.3,'triangle'))}catch(e){}
const b=$('#btns');if(b)b.style.opacity=1}
async function finish(out){if(Q.done)return;Q.done=1;music(false);document.body.className='';
const prev=BR(),r=out?0:Math.max(0,Math.round(rem()));
S.runs.push({r:Q.r,rem:r,done:Q.i,t:Q.at,wrong:Q.wrong,rd:S.round});save();
const better=!prev||Q.i>prev.done||(Q.i==prev.done&&Q.at<prev.t),fin=!out;
if(online()){show('<div class="c" style="margin-top:200px"><h2>Saving your score…</h2></div>');const bb=BR();try{await Promise.race([FB.submit(S.name,bb.done,bb.t,S.round,rg()),tmo(6000)])}catch(e){console.error(e)}}
const bd=await getBoard(1),rk=bd.rk||bd.N||1,N=Math.max(bd.N,rk);
show(`<div class="c" style="margin-top:14px"><h1>${out?'Time’s up':'Finished!'}</h1>
<div id="sc" style="font-size:64px;font-weight:900;color:var(--acc2);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(77,217,255,.5)">${fin?'0.000s':'0/40'}</div>
<p class="mut" style="margin:0">${out?'Correct answers':'Time left'} · ${Q.wrong} wrong tap${Q.wrong==1?'':'s'}</p>
<div id="pb" style="min-height:26px;margin:12px 0;font-weight:800;letter-spacing:2px;color:var(--acc2)"></div>
<div id="rk" style="opacity:0;transition:opacity .4s"><div class="mut" style="font-size:13px;letter-spacing:2px">YOUR RANK</div><div id="rn" style="font-size:78px;font-weight:900;line-height:1">#${N}</div><div id="tier" style="font-size:20px;font-weight:900;min-height:28px;margin-top:6px"></div></div></div>
<div id="btns" style="opacity:0;transition:opacity .5s;margin-top:10px"><button class="btn" onclick="board()">Leaderboard</button><button class="btn alt" onclick="home()">Home</button></div>`);
setTimeout(()=>{const b=$('#btns');if(b)b.style.opacity=1},9000);
roll(0,fin?r/1000:Q.i,2200,v=>{$('#sc').textContent=fin?v.toFixed(3)+'s':Math.round(v)+'/40'},()=>{
const pb=$('#pb');if(!pb)return;pb.textContent=prev?(better?'NEW PERSONAL BEST':'Best so far: '+rs(BR())):'';if(prev&&!better)say('Not bad. You can do it. Rush again!');
if(better&&prev)try{[523,659,784].forEach((f,i)=>osc(AC.currentTime+i*.1,f,.3,.3,'triangle'))}catch(e){}
setTimeout(()=>{const k=$('#rk');if(!k)return;k.style.opacity=1;
roll(N,rk,rk<N?3200:500,v=>{const q=Math.round(v);$('#rn').textContent='#'+q;$('#tier').textContent=q<=1?'NUMBER ONE!':q<=3?'PODIUM':q<=10?'TOP 10':q<=50?'PRIZE ZONE':''},()=>endRank(rk),1)},better&&prev?1000:500)},1)}
// ---------- leaderboard ----------
async function board(){show('<div class="c" style="margin-top:200px"><h2>Loading…</h2></div>');const {L,rk,b,N}=await getBoard(12);
show(`<h2>Leaderboard</h2><p class="mut" style="margin:-4px 0 8px;font-size:13px">${REG[rg()].n} · ${roundName()} round · ${phase().open?'LIVE':'FINAL RESULTS'}</p><div class="card c">${rk?`Your rank<div style="font-size:56px;font-weight:900">#${rk}</div><span class="mut">of ${N} players</span>`:'Finish a run to get ranked'}</div>
<div class="card">${L.slice(0,12).map((x,i)=>`<div class="lb ${x.me?'me':''}"><span>#${i+1} ${x.n}</span><span>${rs(x)}</span></div>`).join('')}${rk>12?`<div class="lb me"><span>#${rk} ${S.name}</span><span>${rs(b)}</span></div>`:''}</div>
<p class="mut" style="font-size:13px">Live version: server-verified times, one prize per verified person, live final for the top players. Ties: time left, then next-best run, then earliest server timestamp.</p><button class="btn alt" onclick="home()">Back</button>`)}
// ---------- earn tries ----------
function earn(){show(`<h2>Earn extra tries</h2><div class="card"><p>Invite a <b>new</b> friend to adRush. When they join and finish a run, you earn <b>1 extra try</b>. You can earn 2 each round this way.</p><p class="mut">Earned this round: ${S.earned} of 2. The same person can’t be counted twice.</p><button class="btn" onclick="invite()">Invite a friend</button><p id="msg" class="mut c"></p><p class="mut c" style="font-size:12px">Demo: the try is added as soon as you tap Invite.</p></div><button class="btn alt" onclick="home()">Back</button>`)}
function grant(m){if(S.earned>=2){$('#msg').textContent='You already have both earned tries.';return}S.earned++;save();$('#msg').textContent=m+' +1 try!'}
function invite(){shareAd();grant('Invite sent.')}
addEventListener('load',boot);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

const cfg={apiKey:"AIzaSyDlQddOV0Pr8llE3Rg6aX9vzCWw2XvFvFQ",authDomain:"adrush-825e9.firebaseapp.com",projectId:"adrush-825e9",storageBucket:"adrush-825e9.firebasestorage.app",messagingSenderId:"494182744553",appId:"1:494182744553:web:ba06748a4308b630b74b78"};
if(cfg.apiKey){
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let uid=null,conf=null,ver=null;
const ready=new Promise(r=>onAuthStateChanged(auth,u=>{uid=u?u.uid:null;r()}));
const key=(d,t)=>d*1000000+(1000000-t),RK=1e8,IDX={AF:0,EU:1,AP:2,AM:3},base=(rgn,R)=>IDX[rgn]*1e13+R*RK;

phone(){return auth.currentUser&&auth.currentUser.phoneNumber||null},

async tries(rgn,round){await ready;if(!uid)return null;const s=await getDoc(doc(db,'players',uid));return s.exists()&&s.data().round===round&&s.data().region===rgn?s.data().used:0},
async useTry(name,rgn,round){await ready;if(!uid)throw new Error('not signed in');const ref=doc(db,'players',uid),s=await getDoc(ref);const used=s.exists()&&s.data().round===round&&s.data().region===rgn?s.data().used+1:1;await setDoc(ref,{name:String(name).slice(0,24),region:rgn,round,used});return used},
async submit(name,d,t,round,rgn){await ready;if(!uid)return;t=Math.round(t);const ref=doc(db,'scores',uid),s=await getDoc(ref),k=key(d,t);if(s.exists()&&s.data().round===round&&s.data().region===rgn&&s.data().key>=k)return;await setDoc(ref,{name:String(name).slice(0,24),region:rgn,round,done:d,t,key:k,rkey:base(rgn,round)+k,at:serverTimestamp()})},
async top(n,R,rgn){const s=await getDocs(query(collection(db,'scores'),...rng(R,rgn),orderBy('rkey','desc'),limit(n)));return s.docs.map(x=>({id:x.id,...x.data()}))},
async rank(R,rgn){await ready;const c=collection(db,'scores'),N=(await getCountFromServer(query(c,...rng(R,rgn)))).data().count,m=uid&&await getDoc(doc(db,'scores',uid));let rk=0;if(m&&m.exists()&&m.data().round===R&&m.data().region===rgn)rk=(await getCountFromServer(query(c,where('rkey','>',m.data().rkey),where('rkey','<',base(rgn,R)+RK)))).data().count+1;return{rk,N,uid}}
}}
