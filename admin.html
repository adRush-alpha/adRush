<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>adRush admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#02050f;--fg:#f4f6fc;--mut:#8b94b1;--card:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));--line:rgba(120,180,255,.2);--acc:#5ee1ff;--gold:#f5c96a;--bad:#ff6b85;--ok:#3ddc84;--g:linear-gradient(135deg,#1560ff,#14b8ff);box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px));line-height:1.4}
main{max-width:560px;margin:0 auto}h1{font-size:22px;margin:4px 0;letter-spacing:-.5px}h3{margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:15px;font-weight:800;margin:8px 0}
.btn.alt{background:var(--card);border:1px solid var(--line);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.mut{color:var(--mut);font-size:13px}.c{text-align:center}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:15px}
.nav{display:flex;align-items:center;gap:8px}.nav button{flex:none;width:46px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px}.nav div{flex:1;text-align:center;font-weight:800}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.sum b{display:block;font-size:22px}
.w{border-left:4px solid var(--acc)}.w.top{border-left-color:var(--gold)}.w.no{border-left-color:var(--bad)}
.k{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}.k:last-child{border:0}.k span:first-child{color:var(--mut)}.k b{text-align:right;word-break:break-word}
.flag{color:var(--bad);font-weight:800;font-size:13px}.ok{color:var(--ok)}
#print{display:none}
@media print{@page{size:A4 landscape;margin:9mm}body{background:#fff;color:#000;padding:0}#screen{display:none}#print{display:block;font-size:8pt;color:#000}
#print h2{font-size:13pt;margin:0 0 2px}#print table{width:100%;border-collapse:collapse;margin:6px 0}#print th,#print td{border:1px solid #888;padding:2px 4px;text-align:left;vertical-align:top}#print th{background:#eee}
#print .cert{border:1px solid #000;padding:6px;margin-top:6px;page-break-inside:avoid}#print .ln{display:inline-block;border-bottom:1px solid #000;width:170px;margin:0 8px}}
</style></head><body><main><div id="screen"></div></main><div id="print"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,query,where,orderBy,limit,getDocs,getDoc,doc,getCountFromServer}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDlQddOV0Pr8llE3Rg6aX9vzCWw2XvFvFQ",authDomain:"adrush-825e9.firebaseapp.com",projectId:"adrush-825e9",storageBucket:"adrush-825e9.firebasestorage.app",messagingSenderId:"494182744553",appId:"1:494182744553:web:ba06748a4308b630b74b78"};
const OWNER='vanzylmartinlouis@gmail.com',DAY=864e5,OFF=72e5,CO='ADARENA',REG='2026/909995/07';
const app=initializeApp(cfg,'admin'),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fm=n=>'R'+Math.round(n).toLocaleString('en-ZA');
let S={user:null,round:null,n:13,prz:[2000,1000,500,250],rows:[],total:0,msg:'',busy:0,loaded:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('adrush-admin')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('adrush-admin',JSON.stringify({n:S.n,prz:S.prz}))}catch(e){}};
function lastRound(){const di=Math.floor((Date.now()+OFF)/DAY),dw=(di+4)%7;let id=null;if(dw==2||dw==3)id=di-(dw-2);else if(dw==5||dw==6)id=di-(dw-5);
if(id!==null)return(id+4)%7==2?id-4:id-3;return dw==1?di-3:di-2}
const nxt=r=>(r+4)%7==2?r+3:r+4,prv=r=>(r+4)%7==2?r-4:r-3;
const dd=(d,o)=>new Date(d).toLocaleDateString('en-ZA',Object.assign({weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'},o||{}));
const rl=r=>dd(r*DAY)+' to '+dd((r+1)*DAY),rc=r=>'closed 00:00 on '+dd((r+2)*DAY)+' (SA time)';
const prize=k=>k==1?S.prz[0]:k==2?S.prz[1]:k==3?S.prz[2]:S.prz[3];
const score=r=>r.done>=40?'40/40 ('+((80000-r.t)/1000).toFixed(3)+'s left)':r.done+'/40 in '+(r.t/1000).toFixed(1)+'s';
const at=x=>x&&x.toDate?x.toDate().toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'}):'';
async function load(){S.busy=1;S.msg='';draw();try{const R=S.round,lo=R*1e8,hi=lo+1e8,c=collection(db,'scores'),rg=[where('rkey','>=',lo),where('rkey','<',hi)];
const[t,n]=await Promise.all([getDocs(query(c,...rg,orderBy('rkey','desc'),limit(S.n))),getCountFromServer(query(c,...rg))]);
S.rows=t.docs.map(d=>({uid:d.id,...d.data()}));S.total=n.data().count;
await Promise.all(S.rows.map(async r=>{const[a,b]=await Promise.all([getDoc(doc(db,'claims',r.uid+'_'+R)),getDoc(doc(db,'contacts',r.uid))]);r.cl=a.exists()?a.data():null;r.ct=b.exists()?b.data():null}));
const cnt={};S.rows.forEach(r=>{if(r.cl)['idno','acc','cell'].forEach(k=>{const v=r.cl[k];if(v)(cnt[k+v]=cnt[k+v]||[]).push(r)})});Object.values(cnt).forEach(a=>{if(a.length>1)a.forEach(r=>r.dup=1)});S.loaded=1}catch(e){console.error(e);S.msg='Could not load ('+(e.code||e.message)+')'}S.busy=0;draw()}
function card(r,i){const k=i+1,c=r.cl;return`<div class="card w${k<=3?' top':''}${c?'':' no'}"><div class="k"><span>Rank</span><b>#${k} · ${esc(r.name)}</b></div><div class="k"><span>Score</span><b>${score(r)}</b></div><div class="k"><span>Prize</span><b>${fm(prize(k))}</b></div>${c?`<div class="k"><span>Full name</span><b>${esc(c.name)}</b></div><div class="k"><span>ID number</span><b>${esc(c.idno)}</b></div><div class="k"><span>Cell</span><b>${esc(c.cell)}</b></div><div class="k"><span>Email</span><b>${esc(c.email||'-')}</b></div><div class="k"><span>Bank</span><b>${esc(c.bank)}</b></div><div class="k"><span>Account no.</span><b>${esc(c.acc)}</b></div><div class="k"><span>POPIA consent</span><b class="ok">Signed “${esc(c.sig)}”, Terms v${esc(c.consent)}</b></div><div class="k"><span>Claimed</span><b>${at(c.at)}</b></div>${k<=3?`<div class="k"><span>Video invite OK</span><b>${c.mkt?'Yes':'No'}</b></div>`:''}`:`<div class="flag">NO CLAIM YET${r.ct?' · contact: '+esc(r.ct.contact):''}</div>`}${r.dup?'<div class="flag">⚠ Duplicate ID, account or cell with another winner</div>':''}</div>`}
function pr(){const R=S.round,tp=S.rows.reduce((a,r,i)=>a+prize(i+1),0);return`<h2>${CO} · Promotional competition winners</h2><div>Registration no. ${REG} · Round ${R}: ${rl(R)}, ${rc(R)}<br>Players in round: ${S.total} · Winners listed: ${S.rows.length} · Total prizes: ${fm(tp)} · Generated: ${new Date().toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'})}<br><i>Confidential: personal information supplied by winners with their POPIA consent, for verification and payment only. Keep this record for at least 3 years.</i></div>
<table><tr><th>#</th><th>Display name</th><th>Score</th><th>Full name / ID no.</th><th>Cell / Email</th><th>Bank / Account</th><th>Prize</th><th>Consent</th></tr>${S.rows.map((r,i)=>{const c=r.cl;return`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${score(r)}</td>${c?`<td>${esc(c.name)}<br>${esc(c.idno)}</td><td>${esc(c.cell)}<br>${esc(c.email||'')}</td><td>${esc(c.bank)}<br>${esc(c.acc)}</td><td>${fm(prize(i+1))}</td><td>${esc(c.sig)}<br>${at(c.at)}${i<3?'<br>Video: '+(c.mkt?'yes':'no'):''}</td>`:`<td colspan="4"><b>NO CLAIM RECEIVED</b></td><td>${fm(prize(i+1))}</td>`}</tr>`}).join('')}</table>
<div class="cert"><b>Certification by independent person (Regulation 11(5), Consumer Protection Act Regulations)</b><br>I, <span class="ln"></span> ☐ independent accountant ☐ registered auditor ☐ attorney ☐ advocate, professional body and membership no. <span class="ln"></span>, confirm that I am independent of ${CO} and its directors, that I have overseen the conducting of this round, that the ranking above agrees with the competition records, and that the winners listed are entitled to the prizes shown.<br><br>Signature <span class="ln"></span> Date <span class="ln"></span></div>`}
function csv(){const h=['Round','Rank','Display name','Correct','Time ms','Prize','Full name','ID number','Cell','Email','Bank','Account','Signature','Terms version','Claimed at','Video OK'],q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const L=[h.map(q).join(',')].concat(S.rows.map((r,i)=>{const c=r.cl||{};return[S.round,i+1,r.name,r.done,r.t,prize(i+1),c.name,c.idno,c.cell,c.email,c.bank,c.acc,c.sig,c.consent,at(c.at),i<3&&c.mkt?'yes':''].map(q).join(',')}));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='adrush-round-'+S.round+'-winners.csv';document.body.appendChild(a);a.click();a.remove()}
function draw(){const s=$('screen');
if(!S.user){s.innerHTML=`<div class="c" style="margin-top:80px"><h1>adRush admin</h1><p class="mut">Private page for the director.</p><button class="btn" id="si">Sign in with Google</button><p class="mut" id="er">${esc(S.msg)}</p></div>`;$('si').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){S.msg=e.code=='auth/unauthorized-domain'?'Add this site under Firebase, Authentication, Settings, Authorized domains.':'Sign-in failed ('+(e.code||e.message)+')';draw()}};return}
if(S.user.email!==OWNER){s.innerHTML=`<div class="c" style="margin-top:80px"><h1>Not authorised</h1><p class="mut">${esc(S.user.email)} is not the admin account.</p><button class="btn alt" id="so">Sign out</button></div>`;$('so').onclick=()=>signOut(auth);return}
const R=S.round,cl=S.rows.filter(r=>r.cl).length,tp=S.rows.reduce((a,r,i)=>a+prize(i+1),0);
s.innerHTML=`<h1>Winners</h1><div class="mut">${esc(S.user.email)} · <u id="so">sign out</u></div>
<div class="card"><div class="nav"><button id="pv">‹</button><div>Round ${R}<div class="mut">${rl(R)}<br>${rc(R)}</div></div><button id="nx">›</button></div>
<div class="row" style="margin-top:10px"><label class="mut">Winners shown<input id="nn" type="number" value="${S.n}"></label></div>
<div class="row" style="margin-top:6px">${[0,1,2,3].map(i=>`<label class="mut">${['1st','2nd','3rd','4th+'][i]} R<input class="pz" data-i="${i}" type="number" value="${S.prz[i]}"></label>`).join('')}</div></div>
<button class="btn" id="go">${S.busy?'Loading…':'Load results'}</button>${S.msg?`<p class="flag">${esc(S.msg)}</p>`:''}
${S.loaded?`<div class="sum"><div><b>${S.total}</b>players</div><div><b>${cl}/${S.rows.length}</b>claims in</div><div><b>${fm(tp)}</b>prizes</div><div><b>${S.rows.filter(r=>r.dup).length}</b>duplicate flags</div></div>
<button class="btn" id="pb">Print / save accountant one-pager (PDF)</button><button class="btn alt" id="cv">Download CSV</button>${S.rows.map(card).join('')}`:''}`;
$('so').onclick=()=>signOut(auth);$('pv').onclick=()=>{S.round=prv(S.round);S.loaded=0;S.rows=[];draw()};$('nx').onclick=()=>{S.round=nxt(S.round);S.loaded=0;S.rows=[];draw()};
$('nn').onchange=e=>{S.n=Math.max(1,Math.min(50,+e.target.value||13));sv()};document.querySelectorAll('.pz').forEach(e=>e.onchange=()=>{S.prz[+e.dataset.i]=+e.value||0;sv();if(S.loaded)draw()});
$('go').onclick=load;if(S.loaded){$('pb').onclick=()=>{$('print').innerHTML=pr();window.print()};$('cv').onclick=csv}}
onAuthStateChanged(auth,u=>{S.user=u;if(S.round==null)S.round=lastRound();draw();if(u&&u.email===OWNER&&!S.loaded)load()});
</script></body></html>
